version: 0.2

env:
  parameter-store:
    AWS_ACCOUNT_ID: /cicd-pipeline/aws-account-id
  variables:
    AWS_REGION: "us-east-1"
    ECR_REPO: "my-nginx-app"
    EKS_CLUSTER: "my-eks-cluster"

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION
      

build:
  commands:
    - echo "No build phase for deploy"

post_build:
    commands:
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER
      - chmod +x Part-2-App-Container-Setup/scripts/deploy.sh
      - Part-2-App-Container-Setup/scripts/deploy.sh
      - kubectl set image deployment/my-app nginx=$IMAGE_URI -n dev